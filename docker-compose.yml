version: "3.9"

services:
  app:
    build: .
    volumes:
      - ./:/app
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://trace:trace@db:5432/trace

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
