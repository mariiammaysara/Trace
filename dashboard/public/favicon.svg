<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>TRACE</title>
  <!-- Same reticle "T" mark as TraceLogo.tsx (src/components/TraceLogo.tsx),
       redrawn as a standalone static asset with the current theme's real hex
       values baked in (a favicon can't reach the app's live CSS custom
       properties in tokens.css). Update this alongside TraceLogo.tsx if the
       brand palette ever changes again: the same caveat the old
       trace-symbol.svg/favicon.svg had, and fell out of sync on. -->
  <rect width="32" height="32" rx="6" fill="#0d0f14" />

  <!-- Outer Corner Reticles (Bounding Box Brackets), color: text-on-dark-subtle -->
  <path d="M 6 11 V 6 H 11" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 21 6 H 26 V 11" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 6 21 V 26 H 11" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" fill="none" />
  <path d="M 21 26 H 26 V 21" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" fill="none" />

  <!-- Central Structural "T", color: text-on-dark -->
  <path d="M 10 13 H 22" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" />
  <path d="M 16 13 V 22" stroke="#f4f4f5" stroke-width="2" stroke-linecap="round" />

  <!-- Spatial Anchor Point, color: accent -->
  <circle cx="16" cy="13" r="1.5" fill="#06b6d4" />
</svg>
