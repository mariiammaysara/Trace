# Stage 1's dataset config -- a real 6-class-narrowed COCO128 subset, built
# by prepare_dataset.py (which copies images + writes remapped/filtered
# label files into ../data/stage1/, gitignored, regenerated by running that
# script). See prepare_dataset.py's docstring for the full "why a copy, why
# these ids" reasoning.
#
# train/val are plain text files, one absolute image path per line.
train: ../data/stage1/split/train.txt
val: ../data/stage1/split/val.txt

# TRACE's own 6 target classes, 0-indexed, matching
# src/detection/yolo_detector.py's DEFAULT_CLASS_ALLOWLIST order exactly --
# NOT COCO's original 80. This is a real class-narrowed retrain, not a
# same-80-classes nudge (see prepare_dataset.py for why that's the deliberate
# choice this time, and TRACE_STUDY_GUIDE.md Section 2 for how the single-
# stage, 80-class version of this fine-tune performed before the two-stage
# redesign).
names:
  0: person
  1: car
  2: motorcycle
  3: bus
  4: truck
  5: bicycle
