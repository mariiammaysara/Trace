# Phase 13 fine-tuning dataset config -- checked in and reproducible from
# this file plus training/prepare_dataset.py (which generates the two list
# files referenced below; see that script's docstring for the real dataset
# source, size, and why a genuine held-out split -- not Ultralytics' own
# bundled coco128.yaml, whose train:/val: are the same 128 images -- was
# built by hand for this phase).
#
# train/val are plain text files, one absolute image path per line -- not
# directories -- so no `path:` root is needed; Ultralytics reads each line
# as-is.
train: data/coco128_split/train.txt
val: data/coco128_split/val.txt

# COCO's original 80 classes, unchanged (verbatim from ultralytics'
# coco128.yaml). TRACE's YoloDetector filters to its 6 target classes by
# NAME after inference (Section 2's class_allowlist), so this fine-tune
# keeps the full 80-class head rather than replacing it -- see
# TRACE_STUDY_GUIDE.md Section 13 for why that's the correct choice here.
names:
